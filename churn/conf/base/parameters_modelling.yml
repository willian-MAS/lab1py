# =============================================================================
# Parâmetros da pipeline: modelling
# =============================================================================
# `class_path` permite trocar de modelo mexendo só no YAML (config-driven):
# o nó carrega a classe dinamicamente com importlib.

# Baseline simples e rápido, para ter uma régua.
modelling_baseline:
  class_path: sklearn.linear_model.LogisticRegression
  target_column: Churn
  train_splits:
    - train
  eval_splits:
    - train
    - test
    - validate

# Modelo candidato com busca de hiperparâmetros (GridSearchCV).
modelling_optimization:
  class_path: catboost.CatBoostClassifier
  target_column: Churn
  train_splits:
    - train
    - test
  eval_splits:
    - train
    - test
    - validate
  init_args:
    random_seed: 42
    verbose: 0
    # nao grava logs em disco: com o GridSearchCV em paralelo (n_jobs=-1), varios
    # processos disputavam a mesma pasta de log e alguns treinos falhavam no Windows
    allow_writing_files: false
  cv: 5
  scoring: roc_auc
  param_grid:
    depth: [2, 4, 8]
    iterations: [10, 100, 300]
    learning_rate: [0.01, 0.05, 0.1]
