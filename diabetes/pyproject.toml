[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.11,<3.14"
name = "diabetes"
readme = "README.md"
description = "Predicao de diabetes (Pima) com Kedro, FastAPI e Docker"
dynamic = ["version"]
dependencies = [
    # framework
    "kedro~=1.6.0",
    "kedro-datasets[json-jsondataset,pandas-csvdataset,pickle-pickledataset]>=8.0",
    "kedro-viz>=12.0",
    # dados e modelagem
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    # api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # exploracao interativa (kedro ipython / kedro jupyter lab)
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
]

[project.scripts]
diabetes = "diabetes.__main__:main"

[project.entry-points."kedro.hooks"]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "pytest-cov>=5,<7",
    "pytest-mock>=3.14,<4.0",
    "ruff~=0.12.0",
    "httpx>=0.27",
]

[tool.setuptools.dynamic]
version = {attr = "diabetes.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.kedro]
package_name = "diabetes"
project_name = "diabetes"
kedro_init_version = "1.6.0"
tools = "['Linting', 'Testing', 'Custom Logging', 'Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.pytest.ini_options]
addopts = "--cov-report term-missing --cov src/diabetes -ra"

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "E",    # pycodestyle errors
    "I",    # isort
    "UP",   # pyupgrade
    "PL",   # pylint
    "T201", # print() - use logging
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Em teste, comparar direto com o literal (200, 404, 2) e mais legivel do que
# criar uma constante para cada numero.
"tests/**" = ["PLR2004"]

[tool.kedro_telemetry]
project_id = "f2a91d60989e4e118879e70f77e7e49f"
