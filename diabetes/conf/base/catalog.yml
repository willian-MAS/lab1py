# =============================================================================
# Data Catalog -- a interface (contrato) entre os nos e o armazenamento
# =============================================================================
# Nenhum no chama pd.read_csv() ou pd.to_csv(): quem resolve I/O e o catalogo.
# Trocar CSV por Parquet, ou local por S3/GCS, e mudanca de YAML.
#
# Camadas: 01_raw (imutavel) -> 02_intermediate (limpo) -> 03_primary (com
# split) -> 04_feature (imputado, clipado, com features e encodado) ->
# 05_model_input (master table escalada) -> 06_models (artefatos) ->
# 07_model_output (predicoes) -> 08_reporting (metricas).

# -----------------------------------------------------------------------------
# Pipeline: data_engineering (treino)
# -----------------------------------------------------------------------------
raw_diabetes_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/diabetes-dataset-modelling.csv

cleaned_diabetes_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/cleaned_diabetes-modelling.csv
  save_args:
    index: false

split_diabetes_data:
  type: pandas.CSVDataset
  filepath: data/03_primary/split_diabetes-modelling.csv
  save_args:
    index: false

imputed_diabetes_data:
  type: pandas.CSVDataset
  filepath: data/04_feature/imputed_diabetes-modelling.csv
  save_args:
    index: false

clipped_diabetes_data:
  type: pandas.CSVDataset
  filepath: data/04_feature/clipped_diabetes-modelling.csv
  save_args:
    index: false

featured_diabetes_data:
  type: pandas.CSVDataset
  filepath: data/04_feature/featured_diabetes-modelling.csv
  save_args:
    index: false

encoded_diabetes_data:
  type: pandas.CSVDataset
  filepath: data/04_feature/encoded_diabetes-modelling.csv
  save_args:
    index: false

master_table:
  type: pandas.CSVDataset
  filepath: data/05_model_input/master_table_diabetes-modelling.csv
  save_args:
    index: false

modelling_imputers:
  type: pickle.PickleDataset
  filepath: data/06_models/modelling_imputers.pkl

modelling_outlier_thresholds:
  type: pickle.PickleDataset
  filepath: data/06_models/modelling_outlier_thresholds.pkl

modelling_encoders:
  type: pickle.PickleDataset
  filepath: data/06_models/modelling_encoders.pkl

modelling_scalers:
  type: pickle.PickleDataset
  filepath: data/06_models/modelling_scalers.pkl

# -----------------------------------------------------------------------------
# Pipeline: modelling
# -----------------------------------------------------------------------------
baseline_model:
  type: pickle.PickleDataset
  filepath: data/06_models/baseline_model.pkl

optimized_model:
  type: pickle.PickleDataset
  filepath: data/06_models/optimized_model.pkl

baseline_metrics:
  type: json.JSONDataset
  filepath: data/08_reporting/baseline_metrics.json

optimized_metrics:
  type: json.JSONDataset
  filepath: data/08_reporting/optimized_metrics.json

# -----------------------------------------------------------------------------
# Pipeline: refit (artefatos de producao)
# -----------------------------------------------------------------------------
refit_imputed_data:
  type: pandas.CSVDataset
  filepath: data/04_feature/refit_imputed_diabetes-modelling.csv
  save_args:
    index: false

refit_clipped_data:
  type: pandas.CSVDataset
  filepath: data/04_feature/refit_clipped_diabetes-modelling.csv
  save_args:
    index: false

refit_featured_data:
  type: pandas.CSVDataset
  filepath: data/04_feature/refit_featured_diabetes-modelling.csv
  save_args:
    index: false

production_imputers:
  type: pickle.PickleDataset
  filepath: data/06_models/production_imputers.pkl

production_outlier_thresholds:
  type: pickle.PickleDataset
  filepath: data/06_models/production_outlier_thresholds.pkl

production_encoders:
  type: pickle.PickleDataset
  filepath: data/06_models/production_encoders.pkl

production_scalers:
  type: pickle.PickleDataset
  filepath: data/06_models/production_scalers.pkl

production_model:
  type: pickle.PickleDataset
  filepath: data/06_models/production_model.pkl

# -----------------------------------------------------------------------------
# Pipeline: inference
# -----------------------------------------------------------------------------
# Obs.: `raw_inference_dataframe` NAO esta no catalogo de proposito. Sem
# entrada, o Kedro usa um MemoryDataset -- e esse e o ponto de injecao usado
# pela API (FastAPI) para servir inferencia online com a MESMA pipeline do
# modo batch.
raw_inference_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/diabetes-dataset-inference.csv

cleaned_inference_data:
